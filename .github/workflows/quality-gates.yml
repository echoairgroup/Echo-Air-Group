name: Echo Air Group quality gates

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Syntax and project checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The committed lockfile predates the pg/discord.js backend dependencies.
        # npm install reconciles it in the isolated CI workspace; do not push this generated lock.
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax and site configuration
        run: npm run check

      - name: Run tests
        run: npm test
