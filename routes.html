<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Routes — Echo Air Group</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================================
           FIXED HEADER
        ========================================================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;

            background: rgba(9, 13, 8, 0.98);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            transition:
                background 0.25s ease,
                box-shadow 0.25s ease,
                backdrop-filter 0.25s ease;
        }

        header.scrolled {
            background: rgba(9, 13, 8, 0.80);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        body {
            padding-top: 80px;
        }


        /* =========================================================
           HEADER LOGO
        ========================================================= */

        .header-logo {
            height: 48px;
            width: auto;
            display: block;
            object-fit: contain;
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            background: #090d08;
            color: white;
            padding: 45px 0 22px;
        }

        .foot-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 50px;
        }

        footer .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            margin-bottom: 16px;
        }

        footer .brand-logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
            display: block;
        }

        footer .brand-text {
            display: flex;
            flex-direction: column;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        footer .brand-text small {
            display: block;
            margin-top: 4px;
            color: #8f988c;
            font-size: 11px;
            font-weight: 600;
        }

        footer p {
            color: #8f988c;
            line-height: 1.7;
        }

        .foot-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .foot-links a {
            color: #cbd2c7;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .foot-links a:hover {
            color: #ace336;
        }

        .copy {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: #737b70;
            font-size: 13px;
        }


        /* =========================================================
           FOOTER SOCIAL BUTTONS
        ========================================================= */

        .footer-social {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
        }

        .footer-social a {
            width: 38px;
            height: 38px;
            border-radius: 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, 0.08);

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .footer-social a:hover {
            transform: translateY(-2px);
            background: rgba(172, 227, 54, 0.15);
        }

        .footer-social img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }


        /* =========================================================
           NEWSKY LIVE MAP
        ========================================================= */

        .newsky-map {
            width: 100%;
            height: 650px;

            border-radius: 18px;
            overflow: hidden;

            background: #101410;

            border: 1px solid #dfe5dc;

            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);

            position: relative;
        }

        .newsky-map iframe {
            width: 100%;
            height: 100%;

            border: 0;
            display: block;
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
            margin-bottom: 20px;
        }

        .map-header h2 {
            margin-bottom: 5px;
        }

        .map-header p {
            margin: 0;
            color: #687267;
        }

        .newsky-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 12px 18px;

            border-radius: 10px;

            background: #ace336;
            color: #17200f;

            text-decoration: none;

            font-weight: 700;

            white-space: nowrap;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .newsky-button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .map-fallback {
            display: none;

            position: absolute;
            inset: 0;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px;

            background: #101410;
            color: white;
        }

        .map-fallback-content {
            max-width: 500px;
        }

        .map-fallback h3 {
            margin-bottom: 10px;
        }

        .map-fallback p {
            color: #c8cec5;
            line-height: 1.6;
        }


        /* =========================================================
           ROUTE SEARCH + FILTER + PAGINATION
        ========================================================= */

        const ROUTES_PER_PAGE = 20;
        let currentRouteFilter = "all";
        let currentRouteSearch = "";
        let visibleRouteLimit = ROUTES_PER_PAGE;

        function getRouteRows() {
            return Array.from(document.querySelectorAll(".route-row[data-type]"));
        }

        function matchesSearch(row) {
            return !currentRouteSearch || row.textContent.toLowerCase().includes(currentRouteSearch);
        }

        function matchesFilter(row) {
            if (currentRouteFilter === "all") return true;
            const type = (row.dataset.type || "").toLowerCase();
            if (currentRouteFilter === "longhaul") {
                const match = row.textContent.match(/([\d,]+)\s*nm/i);
                const distance = match ? Number(match[1].replace(/,/g, "")) : 0;
                return distance >= 3000;
            }
            return type === currentRouteFilter;
        }

        function updateRouteList() {
            const rows = getRouteRows();
            const matches = rows.filter(row => matchesFilter(row) && matchesSearch(row));

            rows.forEach(row => row.style.display = "none");
            matches.slice(0, visibleRouteLimit).forEach(row => row.style.display = "grid");

            const shown = Math.min(visibleRouteLimit, matches.length);
            const count = document.getElementById("routeCount");
            const button = document.getElementById("loadMoreRoutes");
            const empty = document.getElementById("noRoutes");

            if (count) count.textContent = matches.length ? `Showing ${shown} of ${matches.length} routes` : "0 routes";
            if (button) {
                button.style.display = shown < matches.length ? "inline-flex" : "none";
                button.textContent = `Show ${Math.min(ROUTES_PER_PAGE, matches.length - shown)} more`;
            }
            if (empty) empty.style.display = matches.length ? "none" : "block";
        }

        function filterRoutes(type) {
            currentRouteFilter = type;
            visibleRouteLimit = ROUTES_PER_PAGE;
            document.querySelectorAll(".filter").forEach(button => {
                button.classList.toggle("active", button.dataset.filter === type);
            });
            updateRouteList();
        }

        function loadMoreRoutes() {
            visibleRouteLimit += ROUTES_PER_PAGE;
            updateRouteList();
        }

        document.getElementById("routeSearch")?.addEventListener("input", event => {
            currentRouteSearch = event.target.value.trim().toLowerCase();
            visibleRouteLimit = ROUTES_PER_PAGE;
            updateRouteList();
        });

        updateRouteList();

    </script>


</body>

</html>
